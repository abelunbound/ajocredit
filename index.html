<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AjoCredit — Prototype</title>
  <style>
/* AjoCredit — Trust-first fintech */
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root {
  /* Palette A — Institutional (default) */
  --bg: #F4F6F8;
  --surface: #FFFFFF;
  --surface-2: #F8FAFB;
  --ink: #0B1620;
  --ink-2: #39495A;
  --ink-3: #6B7A8A;
  --ink-4: #9CA9B6;
  --line: #E4E9EE;
  --line-2: #EEF2F5;

  --brand: #0E4F47;       /* deep teal-green */
  --brand-ink: #F4FBF9;
  --brand-soft: #E7F1EE;
  --accent: #1B6E89;      /* trust blue */
  --accent-soft: #E4F0F5;
  --gold: #B88A2A;
  --gold-soft: #F6EFDD;
  --danger: #B0392E;
  --danger-soft: #FBECEA;
  --good: #2F7A4C;
  --good-soft: #E4F1EA;

  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 22px;
  --radius-xl: 28px;

  --shadow-1: 0 1px 2px rgba(11,22,32,0.05), 0 2px 8px rgba(11,22,32,0.04);
  --shadow-2: 0 4px 14px rgba(11,22,32,0.08), 0 16px 40px rgba(11,22,32,0.06);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --serif: 'Instrument Serif', Georgia, serif;
}

/* Palette B — Warm Slate */
[data-palette="warm"] {
  --bg: #F6F3EE;
  --surface: #FFFFFF;
  --surface-2: #FBF8F3;
  --ink: #1C1712;
  --ink-2: #4A4238;
  --ink-3: #7A7063;
  --ink-4: #B1A595;
  --line: #ECE5D9;
  --line-2: #F4EEE3;
  --brand: #2B3E2E;
  --brand-soft: #E9EBE4;
  --accent: #7A4B2A;
  --accent-soft: #F2E6D8;
  --gold: #A47328;
  --gold-soft: #F4E7CC;
}

/* Palette C — Midnight */
[data-palette="midnight"] {
  --bg: #0B0F14;
  --surface: #131922;
  --surface-2: #0F141B;
  --ink: #F0F5F9;
  --ink-2: #AEBDCB;
  --ink-3: #76879A;
  --ink-4: #4A5B6F;
  --line: #1F2833;
  --line-2: #182029;
  --brand: #3FB89B;
  --brand-soft: rgba(63,184,155,0.14);
  --accent: #6AA9C8;
  --accent-soft: rgba(106,169,200,0.14);
  --gold: #D9AF5A;
  --gold-soft: rgba(217,175,90,0.14);
  --danger: #E26A5D;
  --danger-soft: rgba(226,106,93,0.14);
  --good: #5AC582;
  --good-soft: rgba(90,197,130,0.14);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, textarea, select { font: inherit; color: inherit; }

/* ————— App shell ————— */
.app {
  width: 100%; height: 100%;
  background: var(--bg);
  display: flex; flex-direction: column;
  color: var(--ink);
  position: relative; overflow: hidden;
}

.screen {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding-bottom: 96px;
  -webkit-overflow-scrolling: touch;
}
.screen.no-tab { padding-bottom: 24px; }

/* ————— Header ————— */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 10px;
  background: var(--bg);
  position: sticky; top: 0; z-index: 4;
}
.topbar .brandmark {
  display: flex; align-items: center; gap: 8px;
  font-weight: 600; font-size: 15px; letter-spacing: -0.01em;
}
.brand-dot {
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--brand);
  display: grid; place-items: center;
  color: var(--brand-ink);
  font-family: var(--serif); font-size: 15px; font-style: italic;
  line-height: 1;
}
.icon-btn {
  width: 36px; height: 36px; border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  display: grid; place-items: center;
  color: var(--ink-2);
  transition: transform .1s ease;
}
.icon-btn:active { transform: scale(0.95); }

/* ————— Buttons ————— */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 20px; border-radius: 12px;
  font-weight: 500; font-size: 15px;
  letter-spacing: -0.01em;
  transition: transform .1s ease, opacity .15s ease;
}
.btn:active { transform: scale(0.985); }
.btn-primary { background: var(--brand); color: var(--brand-ink); }
.btn-primary:hover { opacity: 0.93; }
.btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-accent { background: var(--accent); color: #fff; }
.btn-block { width: 100%; }
.btn-sm { height: 36px; padding: 0 14px; font-size: 13px; border-radius: 10px; }
.btn-xl { height: 56px; font-size: 16px; border-radius: 14px; }

/* ————— Cards ————— */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 18px;
}
.card-flat { background: var(--surface-2); border-radius: var(--radius); padding: 14px; }
.section { padding: 0 20px; }
.section + .section { margin-top: 18px; }

.h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.serif { font-family: var(--serif); font-weight: 400; font-style: italic; letter-spacing: -0.01em; }
.mono { font-family: var(--mono); font-feature-settings: "tnum"; }
.label-xs { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.muted { color: var(--ink-3); }
.muted-2 { color: var(--ink-4); }

/* ————— Tab bar ————— */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-around; align-items: center;
  padding: 10px 12px 22px;
  z-index: 10;
}
.tab {
  flex: 1; display: flex; flex-direction: column; gap: 3px;
  align-items: center; justify-content: center;
  color: var(--ink-4); font-size: 10.5px; font-weight: 500;
  padding: 4px 0 2px;
  transition: color .15s ease;
}
.tab.active { color: var(--brand); }
[data-palette="midnight"] .tab.active { color: var(--brand); }
.tab svg { width: 22px; height: 22px; stroke-width: 1.7; }

/* ————— Pills / badges ————— */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 10px; border-radius: 999px;
  font-size: 12px; font-weight: 500; letter-spacing: -0.01em;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line);
}
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.bad { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.pill.gold { background: var(--gold-soft); color: var(--gold); border-color: transparent; }
.pill.brand { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
.pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ————— Avatars ————— */
.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 600; color: #fff;
  flex-shrink: 0;
  font-family: var(--font);
}
.avatar-lg { width: 56px; height: 56px; font-size: 19px; }
.avatar-xl { width: 72px; height: 72px; font-size: 24px; }
.avatar-sm { width: 28px; height: 28px; font-size: 11px; }

/* ————— Progress ————— */
.bar { height: 6px; border-radius: 999px; background: var(--line-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .4s cubic-bezier(.2,.8,.2,1); }

/* ————— Inputs ————— */
.field {
  display: flex; flex-direction: column; gap: 6px;
}
.field label { font-size: 12px; color: var(--ink-3); font-weight: 500; letter-spacing: -0.01em; }
.input, .select, textarea.input {
  height: 48px; padding: 0 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line);
  color: var(--ink); font-size: 15px;
  transition: border .15s ease, background .15s ease;
  width: 100%;
  outline: none;
}
textarea.input { height: auto; padding: 12px 14px; resize: vertical; }
.input:focus, .select:focus { border-color: var(--brand); background: var(--surface); }

.option-tile {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line);
  transition: all .15s ease;
  cursor: pointer;
  width: 100%; text-align: left;
}
.option-tile:hover { border-color: var(--ink-4); }
.option-tile.selected { border-color: var(--brand); background: var(--brand-soft); }
[data-palette="midnight"] .option-tile.selected { border-color: var(--brand); background: var(--brand-soft); }

.option-check {
  width: 20px; height: 20px; border-radius: 50%;
  border: 1.5px solid var(--line); background: transparent;
  flex-shrink: 0;
  display: grid; place-items: center;
}
.option-tile.selected .option-check { border-color: var(--brand); background: var(--brand); }
.option-tile.selected .option-check svg { opacity: 1; }
.option-check svg { opacity: 0; color: #fff; width: 12px; height: 12px; }

/* ————— Segmented control ————— */
.segment {
  display: inline-flex; padding: 3px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--line);
  gap: 2px;
}
.segment button {
  padding: 6px 12px; border-radius: 9px;
  font-size: 13px; font-weight: 500; color: var(--ink-3);
  transition: all .15s ease;
}
.segment button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* ————— List rows ————— */
.row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line);
}
.row-flat { border: 0; background: transparent; padding: 12px 0; border-bottom: 1px solid var(--line-2); border-radius: 0; }
.row-flat:last-child { border-bottom: 0; }
.row .main { flex: 1; min-width: 0; }
.row .title { font-weight: 500; font-size: 14.5px; letter-spacing: -0.01em; }
.row .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }

/* ————— Rotation timeline ————— */
.timeline {
  position: relative;
  padding-left: 26px;
}
.timeline::before {
  content: ''; position: absolute;
  left: 12px; top: 8px; bottom: 8px;
  width: 2px; background: var(--line);
}
.tl-node {
  position: relative; margin-bottom: 14px;
}
.tl-dot {
  position: absolute; left: -20px; top: 16px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--line);
}
.tl-node.done .tl-dot { background: var(--good); border-color: var(--good); }
.tl-node.now .tl-dot { background: var(--brand); border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.tl-node.future .tl-dot { background: var(--surface); border-color: var(--line); }

/* ————— Empty helpers ————— */
.stack { display: flex; flex-direction: column; }
.row-between { display: flex; align-items: center; justify-content: space-between; }
.row-center { display: flex; align-items: center; gap: 8px; }

/* ————— Tweaks panel ————— */
.tweaks-panel {
  position: fixed; z-index: 999;
  right: 16px; bottom: 16px;
  width: 300px;
  background: #fff; color: #0B1620;
  border-radius: 16px;
  border: 1px solid #E4E9EE;
  box-shadow: 0 20px 60px rgba(11,22,32,0.18);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow: hidden;
}
.tweaks-panel .t-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #EEF2F5; }
.tweaks-panel .t-title { font-weight: 600; font-size: 14px; }
.tweaks-panel .t-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 14px; max-height: 70vh; overflow-y: auto; }
.tweaks-panel label.tl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #6B7A8A; font-weight: 500; }
.tweaks-panel .t-group { display: flex; flex-direction: column; gap: 6px; }
.tweaks-panel .t-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.tweaks-panel .chip {
  padding: 7px 11px; font-size: 12.5px; border-radius: 10px;
  background: #F4F6F8; border: 1px solid #E4E9EE; color: #0B1620;
  cursor: pointer;
}
.tweaks-panel .chip.on { background: #0E4F47; color: #fff; border-color: transparent; }

/* ————— Canvas layout (multi-device) ————— */
.canvas {
  min-height: 100%;
  padding: 60px 40px 120px;
  background:
    radial-gradient(1200px 600px at 20% 0%, #EAF1EE, transparent 70%),
    radial-gradient(900px 500px at 100% 30%, #E8EFF3, transparent 70%),
    #EEF2F5;
}
.canvas-head { max-width: 1400px; margin: 0 auto 40px; }
.canvas-grid {
  max-width: 1400px; margin: 0 auto;
  display: flex; flex-wrap: wrap; gap: 48px 40px; justify-content: flex-start;
}
.device-cell { display: flex; flex-direction: column; gap: 14px; }
.device-label { font-size: 12px; color: #6B7A8A; font-weight: 500; letter-spacing: -0.01em; }
.device-label strong { color: #0B1620; font-weight: 600; margin-right: 6px; }

/* ————— Shimmer ————— */
@keyframes pulse-soft { 0%, 100% { opacity: 1 } 50% { opacity: 0.5 } }
.loading-dot { animation: pulse-soft 1.4s ease-in-out infinite; }

/* ————— Scrollbar ————— */
.screen::-webkit-scrollbar { width: 0; }

/* ————— Mobile single-device view ————— */
@media (max-width: 900px) {
  .canvas { padding: 0; background: var(--bg); }
  .canvas-head { display: none; }
  .canvas-grid { gap: 0; }
  .device-cell:not(.is-primary) { display: none; }
  .device-cell .device-label { display: none; }
}

</style>
</head>
<body data-palette="default">
  <div id="root"></div>

  <script>
    // —— Tweaks defaults ——
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "palette": "default",
      "layout": "cards",
      "deviceLayout": "single"
    }/*EDITMODE-END*/;
    window.__tweaks = Object.assign({}, TWEAK_DEFAULTS, JSON.parse(localStorage.getItem('ajo_tweaks') || '{}'));
    document.body.dataset.palette = window.__tweaks.palette;
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react">

// ===== frames/ios-frame.jsx =====

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>

        {trailingIcon && pillIcon(

}

function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>

        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',

      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',

}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

const AVATAR_PALETTES = [
  ['#0E4F47', '#3FB89B'], ['#1B6E89', '#6AA9C8'], ['#B88A2A', '#E8C468'],
  ['#7A4B2A', '#CC9461'], ['#2F7A4C', '#5AC582'], ['#8A5CB3', '#C49EEB'],
  ['#B0392E', '#E26A5D'], ['#38497A', '#7189C2'], ['#1E5C4A', '#4D9C7F'],
  ['#6B4A22', '#B08A4A'],
];
function avatarColor(name = '') {
  const i = (name.charCodeAt(0) + (name.charCodeAt(1) || 0)) % AVATAR_PALETTES.length;
  return AVATAR_PALETTES[i];
}
function Avatar({ name = '', size = 'md', style = {} }) {
  const sz = size === 'lg' ? 'avatar-lg' : size === 'xl' ? 'avatar-xl' : size === 'sm' ? 'avatar-sm' : '';
  const [a, b] = avatarColor(name);
  const initials = name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  return (
    <div className={`avatar ${sz}`} style={{ background: `linear-gradient(135deg, ${a}, ${b})`, ...style }}>
      {initials}
    </div>
  );
}

// —————— Score ring ——————
function ScoreRing({ score, max = 999, label = 'Credit score', size = 132, tag }) {
  const pct = Math.min(1, score / max);
  const r = size / 2 - 10;
  const c = 2 * Math.PI * r;
  const band =
    score >= 780 ? 'Excellent' :
    score >= 700 ? 'Good' :
    score >= 620 ? 'Fair' : 'Poor';
  const color =
    score >= 780 ? 'var(--good)' :
    score >= 700 ? 'var(--brand)' :
    score >= 620 ? 'var(--gold)' : 'var(--danger)';
  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--line-2)" strokeWidth="8" />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="8"
          strokeDasharray={`${c * pct} ${c}`} strokeLinecap="round" />
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', textAlign: 'center' }}>
        <div>
          <div className="label-xs" style={{ marginBottom: 2 }}>{label}</div>
          <div style={{ fontSize: 30, fontWeight: 600, letterSpacing: '-0.03em', lineHeight: 1 }} className="mono">{score}</div>
          <div style={{ marginTop: 4, fontSize: 12, fontWeight: 500, color }}>{tag || band}</div>
        </div>
      </div>
    </div>
  );
}

const NAV_TABS = ['home', 'circles', 'wallet', 'profile'];

function App({ layout, palette }) {
  const [screen, setScreen] = React.useState(() => localStorage.getItem('ajo_screen') || 'home');
  const [role, setRole] = React.useState(() => localStorage.getItem('ajo_role') || 'member');
  const [onbStep, setOnbStep] = React.useState(0); // 0 welcome, 1 check a, 2 check b, 3 done

  React.useEffect(() => { localStorage.setItem('ajo_screen', screen); }, [screen]);
  React.useEffect(() => { localStorage.setItem('ajo_role', role); }, [role]);

  const nav = (k) => {
    if (k === 'new') setScreen('create');
    else setScreen(k);
  };

  // Onboarding flow
  if (screen === 'onboarding') {
    if (onbStep === 0) return <OnboardingWelcome onNext={() => setOnbStep(1)} onSkip={() => setScreen('home')} onSignIn={() => setOnbStep(10)} />;
    if (onbStep === 10) return <SignIn onBack={() => setOnbStep(0)} onDone={() => { setOnbStep(0); setScreen('home'); }} />;
    if (onbStep === 1) return <CreditCheckA onNext={() => setOnbStep(2)} onBack={() => setOnbStep(0)} />;
    if (onbStep === 2) return <CreditCheckB onNext={() => { setOnbStep(0); setScreen('home'); }} onBack={() => setOnbStep(1)} />;
  }

  // Main screens
  const showTabs = NAV_TABS.includes(screen);
  let content = null;
  if (screen === 'home') content = <Dashboard onNav={setScreen} layout={layout} role={role} />;
  else if (screen === 'circles') content = <CirclesList onNav={setScreen} />;
  else if (screen === 'wallet') content = <Wallet onNav={setScreen} />;
  else if (screen === 'profile') content = <Profile role={role} onRoleChange={setRole} />;
  else if (screen === 'circle-detail') content = <CircleDetail onBack={() => setScreen('home')} onNav={setScreen} role={role} />;
  else if (screen === 'member-profile') content = <MemberProfile onBack={() => setScreen('circle-detail')} />;
  else if (screen === 'rotation') content = <RotationView onBack={() => setScreen('circle-detail')} />;
  else if (screen === 'browse') content = <Browse onBack={() => setScreen('circles')} onNav={setScreen} />;
  else if (screen === 'join-flow') content = <Browse onBack={() => setScreen('circles')} onNav={setScreen} />;
  else if (screen === 'create') content = <CreateCircle onBack={() => setScreen('home')} onDone={() => setScreen('circle-detail')} />;
  else if (screen === 'payout') content = <PayoutFlow onBack={() => setScreen('circle-detail')} onDone={() => setScreen('home')} />;
  else if (screen === 'autoloan') content = <AutoLoan onBack={() => setScreen('home')} />;
  else if (screen === 'score') content = <ScoreDetail onBack={() => setScreen('profile')} />;
  else content = <Dashboard onNav={setScreen} layout={layout} role={role} />;

  return (
    <div className="app">
      <div style={{
        position: 'absolute', top: 10, left: 12, zIndex: 20,
        display: 'flex', gap: 6, alignItems: 'center',
      }}>
        <button className="icon-btn" onClick={() => { setScreen('onboarding'); setOnbStep(0); }}
          style={{ height: 28, width: 'auto', padding: '0 10px', fontSize: 11, color: 'var(--ink-3)', borderRadius: 999 }}
          title="Restart onboarding">
          <Icon.sparkles style={{ width: 12, height: 12 }} /> Onboarding
        </button>
      </div>
      {content}
      {showTabs && <TabBar active={screen} onNav={nav} />}
    </div>
  );
}

</script>

  <script type="text/babel">
    function Root() {
      const [tweaks, setTweaksState] = React.useState(window.__tweaks);
      const [editMode, setEditMode] = React.useState(false);
      const [viewport, setViewport] = React.useState({ w: window.innerWidth });

      React.useEffect(() => {
        const onResize = () => setViewport({ w: window.innerWidth });
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      const setTweaks = (partial) => {
        const next = { ...tweaks, ...partial };
        setTweaksState(next);
        window.__tweaks = next;
        localStorage.setItem('ajo_tweaks', JSON.stringify(next));
        document.body.dataset.palette = next.palette;
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: partial }, '*');
      };

      // Edit mode protocol
      React.useEffect(() => {
        const handler = (e) => {
          if (!e.data || typeof e.data !== 'object') return;
          if (e.data.type === '__activate_edit_mode') setEditMode(true);
          if (e.data.type === '__deactivate_edit_mode') setEditMode(false);
        };
        window.addEventListener('message', handler);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

      const isMobile = viewport.w < 900;

      // Canvas with multi-device presentation
      if (!isMobile && tweaks.deviceLayout === 'canvas') {
        const variants = [
          { title: 'Dashboard — Cards', sub: 'Hero + positions', layout: 'cards', palette: tweaks.palette, primary: true, screen: 'home' },
          { title: 'Dashboard — Timeline', sub: 'Rotation-first', layout: 'timeline', palette: tweaks.palette, screen: 'home' },
          { title: 'Dashboard — Calendar', sub: '10-month grid', layout: 'calendar', palette: tweaks.palette, screen: 'home' },
          { title: 'Credit check · Country of origin', sub: 'Step 2 · bureau pull', layout: 'cards', palette: tweaks.palette, screen: 'check-a-done' },
          { title: 'Credit check · UK affordability', sub: 'Step 3 · Open Banking', layout: 'cards', palette: tweaks.palette, screen: 'check-b-done' },
          { title: 'Circle detail', sub: 'Brum Builders', layout: 'cards', palette: tweaks.palette, screen: 'circle-detail' },
          { title: 'Rotation timeline', sub: '10 months, 10 payouts', layout: 'cards', palette: tweaks.palette, screen: 'rotation' },
          { title: 'Release payout', sub: 'Admin action', layout: 'cards', palette: tweaks.palette, screen: 'payout-review' },
          { title: 'Auto-loan safety net', sub: '0% interest backstop', layout: 'cards', palette: tweaks.palette, screen: 'autoloan' },
          { title: 'Member profile', sub: 'Username only · no bank', layout: 'cards', palette: tweaks.palette, screen: 'member-profile' },
          { title: 'Create circle', sub: 'Amount · frequency · size', layout: 'cards', palette: tweaks.palette, screen: 'create' },
          { title: 'Wallet', sub: 'Virtual account', layout: 'cards', palette: tweaks.palette, screen: 'wallet' },
        ];
        return (
          <div className="canvas" data-palette={tweaks.palette}>
            <div className="canvas-head">
              <div style={{ fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif', fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.12em', color: '#6B7A8A', marginBottom: 14 }}>AjoCredit · Prototype</div>
              <div style={{ fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif', fontSize: 36, fontWeight: 600, letterSpacing: '-0.02em', color: '#0B1620', marginBottom: 10 }}>
                Community savings, credit-checked, <span style={{ fontFamily: 'Instrument Serif', fontStyle: 'italic', fontWeight: 400 }}>payout-guaranteed.</span>
              </div>
              <div style={{ fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif', fontSize: 15, color: '#39495A', maxWidth: 760, lineHeight: 1.55 }}>
                10 friends in Birmingham. £500 monthly. Abel receives £5,000 this month — on schedule, via virtual account, no bank details shared. Three dashboard layouts, full onboarding with dual credit checks (origin + UK affordability), interest-free auto-loan backstop. Tap any screen to interact, or open the <strong>Tweaks</strong> panel to swap palette & layout.
              </div>
              <div style={{ display: 'flex', gap: 8, marginTop: 18, flexWrap: 'wrap' }}>
                <span className="pill good" style={{ fontFamily: 'inherit' }}>10 members · £500/mo</span>
                <span className="pill brand" style={{ fontFamily: 'inherit' }}>Role toggle: Member ↔ Admin</span>
                <span className="pill gold" style={{ fontFamily: 'inherit' }}>Auto-loan armed</span>
                <span className="pill" style={{ fontFamily: 'inherit' }}>Usernames only</span>
              </div>
            </div>
            <div className="canvas-grid">
              {variants.map((v, i) => (
                <DeviceCell key={i} {...v} tweaks={tweaks} setTweaks={setTweaks} />
              ))}
            </div>
            {editMode && <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} canvas />}
          </div>
        );
      }

      // Single device mode (mobile or single-screen tweak)
      return (
        <div style={{
          width: '100vw', height: '100vh',
          display: 'grid', placeItems: 'center',
          background: 'var(--bg)',
          overflow: isMobile ? 'auto' : 'hidden',
        }} data-palette={tweaks.palette}>
          {isMobile ? (
            <div style={{ width: '100%', height: '100vh', maxHeight: '100vh', background: 'var(--bg)' }} data-screen-label="AjoCredit">
              <App layout={tweaks.layout} palette={tweaks.palette} />
            </div>
          ) : (
            <IOSDevice title={undefined}>
              <App layout={tweaks.layout} palette={tweaks.palette} />
            </IOSDevice>
          )}
          {editMode && <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} />}
        </div>
      );
    }

    function DeviceCell({ title, sub, layout, palette, screen, primary, tweaks }) {
      // Build a mini sub-app that renders the targeted screen
      return (
        <div className={`device-cell ${primary ? 'is-primary' : ''}`} data-screen-label={title}>
          <div className="device-label"><strong>{title}</strong>{sub}</div>
          <IOSDevice width={360} height={780} title={undefined}>
            <ScopedApp initialScreen={screen} layout={layout} />
          </IOSDevice>
        </div>
      );
    }

    function ScopedApp({ initialScreen, layout }) {
      const [screen, setScreen] = React.useState(initialScreen);
      const [role, setRole] = React.useState('member');

      // Special pseudo-screens
      if (screen === 'check-a-done') {
        return <CreditCheckADone />;
      }
      if (screen === 'check-b-done') {
        return <CreditCheckBDone />;
      }
      if (screen === 'payout-review') {
        return <PayoutReviewPreview />;
      }

      const showTabs = ['home', 'circles', 'wallet', 'profile'].includes(screen);
      let content = null;
      if (screen === 'home') content = <Dashboard onNav={setScreen} layout={layout} role={role} />;
      else if (screen === 'circles') content = <CirclesList onNav={setScreen} />;
      else if (screen === 'wallet') content = <Wallet onNav={setScreen} />;
      else if (screen === 'profile') content = <Profile role={role} onRoleChange={setRole} />;
      else if (screen === 'circle-detail') content = <CircleDetail onBack={() => setScreen('home')} onNav={setScreen} role={role} />;
      else if (screen === 'member-profile') content = <MemberProfile onBack={() => setScreen('home')} />;
      else if (screen === 'rotation') content = <RotationView onBack={() => setScreen('home')} />;
      else if (screen === 'create') content = <CreateCircle onBack={() => setScreen('home')} onDone={() => setScreen('home')} />;
      else if (screen === 'autoloan') content = <AutoLoan onBack={() => setScreen('home')} />;
      else content = <Dashboard onNav={setScreen} layout={layout} role={role} />;

      return (
        <div className="app">
          {content}
          {showTabs && <TabBar active={screen} onNav={(k) => setScreen(k === 'new' ? 'create' : k)} />}
        </div>
      );
    }

    // Pseudo-screens for canvas previews
    function CreditCheckADone() {
      return <CreditCheckA onNext={() => {}} onBack={() => {}} />;
    }
    function CreditCheckBDone() {
      return <CreditCheckB onNext={() => {}} onBack={() => {}} />;
    }
    function PayoutReviewPreview() {
      return <PayoutFlow onBack={() => {}} onDone={() => {}} />;
    }

    // Tweaks panel
    function TweaksPanel({ tweaks, setTweaks, canvas }) {
      return (
        <div className="tweaks-panel">
          <div className="t-head">
            <div className="t-title">Tweaks</div>
            <span style={{ fontSize: 11, color: '#6B7A8A', fontFamily: 'IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' }}>AjoCredit</span>
          </div>
          <div className="t-body">
            <div className="t-group">
              <label className="tl">Palette</label>
              <div className="t-chips">
                {[
                  ['default', 'Institutional'],
                  ['warm', 'Warm slate'],
                  ['midnight', 'Midnight'],
                ].map(([k, l]) => (
                  <button key={k} className={`chip ${tweaks.palette === k ? 'on' : ''}`} onClick={() => setTweaks({ palette: k })}>{l}</button>
                ))}
              </div>
            </div>

            <div className="t-group">
              <label className="tl">Dashboard layout</label>
              <div className="t-chips">
                {[
                  ['cards', 'Cards'],
                  ['timeline', 'Timeline'],
                  ['calendar', 'Calendar'],
                ].map(([k, l]) => (
                  <button key={k} className={`chip ${tweaks.layout === k ? 'on' : ''}`} onClick={() => setTweaks({ layout: k })}>{l}</button>
                ))}
              </div>
            </div>

            <div className="t-group">
              <label className="tl">View</label>
              <div className="t-chips">
                <button className={`chip ${tweaks.deviceLayout === 'canvas' ? 'on' : ''}`} onClick={() => setTweaks({ deviceLayout: 'canvas' })}>Canvas (all screens)</button>
                <button className={`chip ${tweaks.deviceLayout === 'single' ? 'on' : ''}`} onClick={() => setTweaks({ deviceLayout: 'single' })}>Single device</button>
              </div>
            </div>

            <div style={{ fontSize: 11, color: '#6B7A8A', lineHeight: 1.4 }}>
              Tip: on mobile, only the primary device shows — palette + layout still apply.
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
