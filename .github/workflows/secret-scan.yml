name: Secret Scan

on:
  push:
    branches:
      - main
      - 'cursor/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download and verify Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          GITLEAKS_CHECKSUM="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
          
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          
          # Verify checksum
          echo "${GITLEAKS_CHECKSUM}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          if [ $? -ne 0 ]; then
            echo "::error::Gitleaks checksum verification failed"
            exit 1
          fi
          
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          chmod +x gitleaks
          ./gitleaks version

      - name: Run Gitleaks scan
        run: |
          ./gitleaks detect --source . --verbose --log-level info --report-format sarif --report-path gitleaks-report.sarif
          exit_code=$?
          if [ $exit_code -eq 1 ]; then
            echo "::error::Gitleaks detected secrets in the repository"
            exit 1
          fi
